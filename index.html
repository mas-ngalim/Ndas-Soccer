<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ndas Soccer</title>
    <style>
        body { margin: 0; overflow: hidden; background-image:url('background lapangan.jpg'); background-size: cover;background-position: center;font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; align-items: center; color: yellow; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none; visibility: hidden; }
        #timerBox { font-size: 30px; color: yellow; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-image:url('background menu.jpg');background-size:cover;background-position:center;z-index: 100; color: white; text-align: center; overflow-y: auto; }
        .menu-btn { width: 220px; padding: 15px; margin: 5px; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; color: white; font-weight: bold; }
        .upload-btn { background: #9b59b6; padding: 10px; font-size: 14px; margin-bottom: 10px; }
        .controls-container { position: absolute; bottom: 40px; width: 100%; height: 120px; z-index: 20; visibility: hidden; pointer-events: none; }
        .move-controls { position: absolute; left: 20px; display: flex; gap: 15px; pointer-events: auto; }
        .action-controls { position: absolute; right: 30px; pointer-events: auto; }
        .btn { width: 85px; height: 85px; background: rgba(255,255,255,0.25); border: 4px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 6px 0 rgba(0,0,0,0.2); -webkit-tap-highlight-color: transparent; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="color: gold; text-shadow: 3px 3px #000; font-size: 40px;">NDAS SOCCER ⚽</h1>
    <p style="color:#03ffff">ganti gambare sekarepmu dewek!!</p>
    <div style="margin-bottom: 20px;">
        <label for="p1File" class="menu-btn upload-btn" style="display: inline-block;">aplod poto ndasmu</label>
        <input type="file" id="p1File" accept="image/*">
        
        <label for="botFile" class="menu-btn upload-btn" style="display: inline-block;">aplod poto ndase lawan</label>
        <input type="file" id="botFile" accept="image/*">
    </div>
    
    <p style="color:#03ffff">tingkatan lawane =</p>
    <button class="menu-btn" style="background:#2ecc71" onclick="startGame('easy')">KROCO</button>
    <button class="menu-btn" style="background:#f1c40f" onclick="startGame('medium')">LUMAYAN</button>
    <button class="menu-btn" style="background:#e74c3c" onclick="startGame('hard')">PRO</button>
    
    <h3 style="color:#faff03">pepeling: wektune semenit ora ana babak ke2</h3>
</div>

<div id="ui">
    <div>KOE<br><span id="p1Score">0</span></div>
    <div id="timerBox">01:00</div>
    <div>LAWAN<br><span id="p2Score">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="gameControls" class="controls-container">
    <div class="move-controls"><div id="btnLeft" class="btn">⬅️</div><div id="btnRight" class="btn">➡️</div></div>
    <div class="action-controls"><div id="btnJump" class="btn">⬆️</div></div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Assets Gambar
let imgP1 = null;
let imgBot = null;

// Handle Upload Gambar
document.getElementById('p1File').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = (event) => { imgP1 = new Image(); imgP1.src = event.target.result; };
    reader.readAsDataURL(e.target.files[0]);
});

document.getElementById('botFile').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = (event) => { imgBot = new Image(); imgBot.src = event.target.result; };
    reader.readAsDataURL(e.target.files[0]);
});

function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='kick'){ osc.frequency.setValueAtTime(150, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    if(type==='goal'){ osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime+0.5); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
}

canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const gravity = 0.65; const groundHeight = 50;
let gameActive = false, timeLeft = 60;
let p1 = { x: 100, y: 0, w: 80, h: 80, dx: 0, dy: 0, speed: 7, jump: -15 };
let bot = { x: canvas.width - 180, y: 0, w: 80, h: 80, dx: 0, dy: 0, speed: 5, jump: -14 };
let ball = { x: canvas.width/2, y: 100, r: 18, dx: 0, dy: 0, angle: 0 };
let scores = { p1: 0, bot: 0 }, keys = { left: false, right: false };

function startGame(lvl) {
    const speeds = { easy: 3.5, medium: 5.5, hard: 8 };
    bot.speed = speeds[lvl];
    document.getElementById("overlay").style.display = "none";
    document.getElementById("ui").style.visibility = "visible";
    document.getElementById("gameControls").style.visibility = "visible";
    gameActive = true; update();
}

setInterval(() => { if(gameActive) { timeLeft--; updateTimerUI(); if(timeLeft<=0) endGame(); } }, 1000);
function updateTimerUI() {
    let m = Math.floor(timeLeft/60), s = timeLeft%60;
    document.getElementById('timerBox').innerText = `${m}:${s.toString().padStart(2,'0')}`;
}

// Touch Controls
const btnL = document.getElementById('btnLeft');
const btnR = document.getElementById('btnRight');
const btnJ = document.getElementById('btnJump');
btnL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
btnL.addEventListener('touchend', () => keys.left = false);
btnR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
btnR.addEventListener('touchend', () => keys.right = false);
btnJ.addEventListener('touchstart', (e) => { e.preventDefault(); if(p1.y >= canvas.height - groundHeight - p1.h) p1.dy = p1.jump; });

function update() {
    if (!gameActive) return;
    p1.dx = keys.left ? -p1.speed : (keys.right ? p1.speed : p1.dx * 0.8);
    applyPhysics(p1);
    if (ball.x > bot.x + 35) bot.dx = bot.speed; else if (ball.x < bot.x - 5) bot.dx = -bot.speed;
    if (ball.y < bot.y - 40 && Math.abs(ball.x - bot.x) < 100 && bot.y >= canvas.height - groundHeight - bot.h) bot.dy = bot.jump;
    applyPhysics(bot);

    ball.dy += gravity * 0.45; ball.x += ball.dx; ball.y += ball.dy; ball.angle += ball.dx * 0.05;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -0.7; }
    if (ball.y + ball.r > canvas.height - groundHeight) { ball.y = canvas.height - groundHeight - ball.r; ball.dy *= -0.7; }
    
    if (ball.x - ball.r < 0) {
        if (ball.y < canvas.height - 180) { ball.x = ball.r; ball.dx *= -0.8; }
        else if (ball.x < -ball.r) handleGoal('bot');
    }
    if (ball.x + ball.r > canvas.width) {
        if (ball.y < canvas.height - 180) { ball.x = canvas.width - ball.r; ball.dx *= -0.8; }
        else if (ball.x > canvas.width + ball.r) handleGoal('p1');
    }

    checkColl(p1, ball); checkColl(bot, ball);
    draw(); requestAnimationFrame(update);
}

function applyPhysics(o) {
    o.dy += gravity; o.x += o.dx; o.y += o.dy;
    if (o.y + o.h > canvas.height - groundHeight) { o.y = canvas.height - groundHeight - o.h; o.dy = 0; }
    o.x = Math.max(0, Math.min(canvas.width - o.w, o.x));
}

function checkColl(p, b) {
    let dx = b.x - (p.x + p.w/2), dy = b.y - (p.y + p.h/2), dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < b.r + p.w/2) { 
        b.dy = -11; 
        b.dx = dx * 0.6; 
        playSound('kick'); 
        // Prevent ball sticking
        b.y = p.y - b.r;
    }
}

function handleGoal(w) {
    gameActive = false; playSound('goal');
    w === 'p1' ? scores.p1++ : scores.bot++;
    document.getElementById('p1Score').innerText = scores.p1;
    document.getElementById('p2Score').innerText = scores.bot;
    setTimeout(() => { if(timeLeft>0) { resetPos(); gameActive = true; update(); } }, 1200);
}

function resetPos() { ball.x = canvas.width/2; ball.y = 100; ball.dx = 0; ball.dy = 0; p1.x = 100; bot.x = canvas.width - 170; }

function endGame() {
    gameActive = false;
    let m = scores.p1 > scores.bot ? "Beja anu lah 👏" : "BOT kaya kue tok kalah!! 👻";
    document.getElementById("overlay").innerHTML = `<h1>${m}</h1><button class="menu-btn" style="background:#2ecc71" onclick="location.reload()">GAS DOLANAN MANING</button>`;
    document.getElementById("overlay").style.display = "flex";
}

function drawPlayer(img, p, defaultEmoji) {
    if (img) {
        ctx.save();
        // Membuat efek foto bulat (circular clipping)
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, p.x, p.y, p.w, p.h);
        ctx.restore();
        // Memberi border tipis agar terlihat rapi
        ctx.strokeStyle = "white"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI * 2);
        ctx.stroke();
    } else {
        ctx.font = "70px Arial";
        ctx.fillText(defaultEmoji, p.x, p.y + 65);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Lapangan
    ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
    
    // Gawang
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
    ctx.strokeRect(-5, canvas.height - 180, 40, 180); 
    ctx.strokeRect(canvas.width - 35, canvas.height - 180, 40, 180);

    // Pemain & Bot
    drawPlayer(imgP1, p1, "🟢");
    drawPlayer(imgBot, bot, "🔴");

    // Bola
    ctx.save(); 
    ctx.translate(ball.x, ball.y); 
    ctx.rotate(ball.angle); 
    ctx.font = "40px Arial";
    ctx.fillText("⚽", -22, 18); 
    ctx.restore();
}
</script>
</body>
</html>
